<svg xmlns="http://www.w3.org/2000/svg" width="320" height="220" viewBox="0 0 320 220" fill="none">
  <title>A little coding cat</title>
  <style>
    .tail { transform-box:fill-box; transform-origin:right bottom; animation:tail 3.8s ease-in-out infinite; }
    .head { transform-box:fill-box; transform-origin:center bottom; animation:nod 2.5s ease-in-out infinite; }
    .eyes { transform-box:fill-box; transform-origin:center; animation:blink 5.2s infinite; }
    .paw-left { animation:type-left .55s ease-in-out infinite; }
    .paw-right { animation:type-right .55s ease-in-out infinite; }
    .cursor { animation:cursor 1s steps(1) infinite; }
    .code-one { animation:code 3s steps(1) infinite; }
    .code-two { animation:code 3s steps(1) .8s infinite; }
    .steam { animation:steam 3s ease-in-out infinite; }
    @keyframes tail { 0%,100% { transform:rotate(-4deg); } 50% { transform:rotate(5deg); } }
    @keyframes nod { 0%,100% { transform:translateY(0) rotate(-1deg); } 50% { transform:translateY(1.5px) rotate(1deg); } }
    @keyframes blink { 0%,42%,46%,100% { transform:scaleY(1); } 44% { transform:scaleY(.08); } }
    @keyframes type-left { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-5px); } }
    @keyframes type-right { 0%,100% { transform:translateY(-5px); } 50% { transform:translateY(0); } }
    @keyframes cursor { 0%,50% { opacity:1; } 51%,100% { opacity:0; } }
    @keyframes code { 0%,20%,100% { opacity:.35; } 21%,85% { opacity:1; } }
    @keyframes steam { 0%,100% { opacity:.4; transform:translateY(0); } 50% { opacity:.8; transform:translateY(-4px); } }
    @media (prefers-reduced-motion:reduce) { * { animation:none !important; } }
  </style>
